name: Native Web
on:
  push:
    branches: [native-webui]
  pull_request:
    branches: [native-webui]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    if: github.repository == 'choneer/TwitchDropsMiner'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          load: true
          tags: tdm-web:test
          cache-from: type=gha,scope=native-web
          cache-to: type=gha,mode=max,scope=native-web
      - name: Offline unit and API integration tests
        run: docker run --rm --network none --entrypoint python -v "$PWD/tests:/tests:ro" -e TDM_DATA_DIR=/tmp/test-data tdm-web:test -m unittest discover -s /tests -v
      - name: Campaign presentation regression tests
        run: node --test tests/campaigns.test.cjs
      - name: Offline deployment smoke
        run: bash docker/smoke-web.sh tdm-web:test
      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ghcr.io/choneer/twitchdropsminer:web
            ghcr.io/choneer/twitchdropsminer:web-sha-${{ github.sha }}
          cache-from: type=gha,scope=native-web
