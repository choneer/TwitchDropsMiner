[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/tdm/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/run/tdm/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/tdm/supervisor.sock

[program:display]
command=/usr/bin/Xvfb :0 -screen 0 1280x800x24 -nolisten tcp -ac
user=miner
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:desktop]
command=/usr/bin/openbox --sm-disable
user=miner
priority=20
autorestart=true
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:vnc]
command=/usr/bin/x11vnc -display :0 -forever -shared -localhost -nopw -rfbport 5900 -noxdamage -repeat
user=miner
priority=20
autorestart=true
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:websocket]
command=/usr/bin/websockify --web=/usr/share/novnc 127.0.0.1:6080 127.0.0.1:5900
user=miner
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:miner]
command=/opt/container/start-miner.sh
user=miner
priority=40
autorestart=unexpected
exitcodes=0
startsecs=10
stopwaitsecs=120
stopasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:web]
command=/usr/sbin/nginx -g "daemon off;"
priority=50
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
